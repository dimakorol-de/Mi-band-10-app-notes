<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Clipboard Shuttler</title>
    <style>
        body { background-color: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; margin: 0; }
        .card { width: 100%; max-width: 400px; background: #1C1C1E; border-radius: 16px; padding: 20px; box-shadow: 0 4px 30px rgba(255, 69, 0, 0.1); border: 1px solid #2C2C2E; box-sizing: border-box; }
        h1 { font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #FF4500; margin-top: 0; text-align: center; }
        p { font-size: 13px; color: #8E8E93; text-align: center; margin-bottom: 20px; letter-spacing: 1px; }
        .input-code { width: 100%; height: 46px; background-color: #2C2C2E; border: 2px solid #FF4500; border-radius: 12px; color: #FFFFFF; text-align: center; font-size: 18px; font-weight: bold; letter-spacing: 2px; box-sizing: border-box; margin-bottom: 15px; }
        textarea { width: 100%; height: 150px; background-color: #2C2C2E; border: 1px solid #3A3A3C; border-radius: 12px; color: #FFFFFF; padding: 12px; font-size: 15px; resize: none; box-sizing: border-box; margin-bottom: 15px; }
        .file-label { display: block; text-align: center; background: rgba(255, 69, 0, 0.1); color: #FF4500; border: 2px dashed #FF4500; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 15px; letter-spacing: 1px; }
        input[type="file"] { display: none; }
        button { width: 100%; height: 46px; background-color: #FF4500; border: none; border-radius: 12px; color: #FFFFFF; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; letter-spacing: 1px; }
        button:active { background-color: #CC3700; }
        .status { font-size: 13px; font-weight: bold; text-align: center; margin-top: 15px; display: none; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>CLIPBOARD TO WATCH</h1>
        <p>Введите код с экрана браслета для отправки текста</p>
        
        <!-- Поле для ввода 5 цифр с браслета -->
        <input type="text" id="watch-code" class="input-code" placeholder="КОД С ЧАСОВ" maxlength="5">

        <label class="file-label" id="file-drop">
            Выбрать текстовый файл .txt
            <input type="file" id="file-input" accept=".txt">
        </label>
        <textarea id="text-area" placeholder="Вставьте текст или загрузите файл..."></textarea>
        <button onclick="sendToWatch()">Отправить на браслет</button>
        <div id="status-msg" class="status"></div>
    </div>

    <script>
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById('text-area').value = evt.target.result;
                document.getElementById('file-drop').innerText = "Файл загружен";
            };
            reader.readAsText(file);
        });

        async function sendToWatch() {
            const code = document.getElementById('watch-code').value.trim();
            const text = document.getElementById('text-area').value;
            const statusMsg = document.getElementById('status-msg');
            
            if (!code || code.length !== 5) { alert('Введите 5-значный код с экрана часов!'); return; }
            if (!text.trim()) { alert('Введите текст или загрузите файл!'); return; }
            
            statusMsg.style.display = "block";
            statusMsg.innerText = "Отправка...";
            statusMsg.style.color = "#FF4500";

            try {
                const token = "mb10_clip_" + code;
                const sl = String.fromCharCode(47);
                const targetUrl = 'https:' + sl + sl + 'keyvalue.xyz' + sl + 'v1' + sl + token + sl + 'note';
                
                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: text
                });

                if (response.ok) {
                    statusMsg.innerText = "Успешно отправлено! Нажмите кнопку на часах.";
                    statusMsg.style.color = "#34C759";
                } else {
                    statusMsg.innerText = "Ошибка сервера KeyValue.";
                    statusMsg.style.color = "#FF3B30";
                }
            } catch (err) {
                statusMsg.innerText = "Сбой сети при отправке.";
                statusMsg.style.color = "#FF3B30";
            }
        }
    </script>
</body>
</html>
