name: Build and Release Clipboard App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: |
          pip install Pillow

      - name: Generate App Icon, Manifest and Package
        run: |
          python - << 'EOF'
          import os
          from PIL import Image, ImageDraw
          
          os.makedirs('src/common', exist_ok=True)
          os.makedirs('src/pages/index', exist_ok=True)
          
          # 1. Рисуем иконку в стиле iOS Заметок
          img = Image.new('RGB', (512, 512), color='#000000')
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle((30, 30, 482, 482), radius=115, fill='#FFFFFF')
          draw.rounded_rectangle((30, 30, 482, 130), radius=30, fill='#EBB700')
          draw.rectangle((30, 80, 482, 130), fill='#EBB700')
          
          line_color = '#E5E5EA'
          draw.line([(60, 200), (452, 200)], fill=line_color, width=6)
          draw.line([(60, 270), (452, 270)], fill=line_color, width=6)
          draw.line([(60, 340), (452, 340)], fill=line_color, width=6)
          draw.line([(60, 410), (452, 410)], fill=line_color, width=6)
          
          final_img = img.resize((192, 192), Image.Resampling.LANCZOS)
          final_img.save('src/common/icon.png')
          final_img.save('src/common/logo.png')
          
          import json
          # 2. Перезаписываем чистый manifest.json
          manifest = {
              "package": "com.soldatov.clipboard",
              "name": "Буфер",
              "versionName": "1.0.0",
              "versionCode": 1,
              "minPlatformVersion": 1000,
              "icon": "/common/icon.png",
              "deviceTypeList": ["band", "watch"],
              "features": [
                  { "name": "system.router" },
                  { "name": "system.vibrator" },
                  { "name": "system.storage" },
                  { "name": "system.fetch" }
              ],
              "config": {
                  "logLevel": "log",
                  "designWidth": 212
              },
              "router": {
                  "entry": "pages/index",
                  "pages": {
                      "pages/index": {
                          "component": "index"
                      }
                  }
              }
          }
          with open('src/manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              
          # 3. Генерируем правильный package.json со сборщиком hap-toolkit
          package_json = {
              "name": "com.soldatov.clipboard",
              "version": "1.0.0",
              "scripts": {
                "build": "hap build",
                "release": "hap release"
              },
              "devDependencies": {
                  "hap-toolkit": "^0.6.13"
              }
          }
          with open('package.json', 'w', encoding='utf-8') as f:
              json.dump(package_json, f, ensure_ascii=False, indent=2)
              
          print("Все конфигурационные файлы успешно созданы!")
          EOF

      - name: Install and Build Clipboard
        run: |
          npm install
          mkdir -p sign/release
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout sign/release/private.pem -out sign/release/certificate.pem -subj "/CN=localhost"
          npm run release
          mkdir -p dist_output
          find dist/ -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} dist_output/clipboard.rpk \;

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpk-binaries
          path: dist_output/
